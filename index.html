<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LUXE BAG - 精品包包专区</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Noto+Sans+SC:wght@300;400;500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

<!-- ===== 顶部导航 ===== -->
<header class="navbar">
  <div class="nav-inner">
    <div class="nav-logo">
      <span class="logo-icon">👜</span>
      <span class="logo-text">LUXE BAG</span>
    </div>
    <nav class="nav-links">
      <a href="#" class="nav-link active">首页</a>
      <a href="#" class="nav-link">全部商品</a>
      <a href="#" class="nav-link">新品上市</a>
      <a href="#" class="nav-link">限时折扣</a>
      <a href="#" class="nav-link">关于我们</a>
    </nav>
    <div class="nav-right">
      <div class="search-box">
        <input type="text" placeholder="搜索包包款式..." class="search-input" />
        <button class="search-btn">🔍</button>
      </div>
      <button class="nav-icon-btn">👤</button>
      <button class="hamburger-btn" id="hamburgerBtn" aria-label="菜单">
        <span></span><span></span><span></span>
      </button>
    </div>
  </div>
  <!-- 手机端抽屉菜单 -->
  <div class="mobile-menu" id="mobileMenu">
    <a href="#" class="mobile-nav-link">🏠 首页</a>
    <a href="#" class="mobile-nav-link">🛍️ 全部商品</a>
    <a href="#" class="mobile-nav-link">✨ 新品上市</a>
    <a href="#" class="mobile-nav-link">🔥 限时折扣</a>
    <a href="#" class="mobile-nav-link">💬 关于我们</a>
  </div>
</header>

<!-- ===== 主内容区 ===== -->
<main class="main-content">

  <!-- 页面标题 -->
  <div class="page-header">
    <h1 class="page-title">精品包包专区</h1>
    <p class="page-subtitle">精选全球高品质时尚包包，满足您的各种需求喜好</p>
  </div>

  <!-- 分类标签 -->
  <div class="category-tabs">
    <button class="tab-btn active" data-cat="all">全部</button>
    <button class="tab-btn" data-cat="水桶包">水桶包</button>
    <button class="tab-btn" data-cat="手提包">手提包</button>
    <button class="tab-btn" data-cat="手袋">手袋</button>
    <button class="tab-btn" data-cat="腰包">腰包</button>
    <button class="tab-btn" data-cat="斜挎包">斜挎包</button>
    <button class="tab-btn" data-cat="双肩包">双肩包</button>
    <button class="tab-btn" data-cat="相亲包">相亲包</button>
  </div>

  <!-- 筛选栏 -->
  <div class="filter-bar">
    <div class="filter-left">
      <div class="filter-group">
        <label>价格区间</label>
        <select class="filter-select">
          <option>全部价格</option>
          <option>¥0 - ¥500</option>
          <option>¥500 - ¥1000</option>
          <option>¥1000 - ¥2000</option>
          <option>¥2000以上</option>
        </select>
      </div>
      <div class="filter-group">
        <label>品牌</label>
        <select class="filter-select">
          <option>全部品牌</option>
          <option>LUXE BAG</option>
        </select>
      </div>
      <div class="filter-group">
        <label>材质</label>
        <select class="filter-select">
          <option>全部材质</option>
          <option>头层牛皮</option>
          <option>PU皮</option>
          <option>帆布</option>
        </select>
      </div>
      <div class="color-filters">
        <span class="color-dot" style="background:#fff" title="白色"></span>
        <span class="color-dot" style="background:#e8d5c4" title="米色"></span>
        <span class="color-dot" style="background:#d4a853" title="金色"></span>
        <span class="color-dot" style="background:#c0392b" title="红色"></span>
        <span class="color-dot" style="background:#8e44ad" title="紫色"></span>
        <span class="color-dot" style="background:#2c3e50" title="深色"></span>
        <span class="color-dot color-more" title="更多">+</span>
      </div>
    </div>
    <div class="filter-right">
      <span class="sort-label">排序</span>
      <button class="sort-btn active">价格 1</button>
      <button class="sort-btn">价格 2</button>
      <button class="sort-btn">新品</button>
      <div class="view-toggle">
        <button class="view-btn active" id="gridViewBtn" title="网格视图">⊞</button>
        <button class="view-btn" id="listViewBtn" title="列表视图">☰</button>
      </div>
    </div>
  </div>

  <!-- 商品网格 -->
  <div class="product-grid" id="productGrid">
    <!-- JS 动态渲染 -->
  </div>

  <!-- 分页 -->
  <div class="pagination">
    <button class="page-btn prev-btn">‹</button>
    <button class="page-btn active">1</button>
    <button class="page-btn">2</button>
    <button class="page-btn">3</button>
    <button class="page-btn">4</button>
    <button class="page-btn">5</button>
    <span class="page-ellipsis">...</span>
    <button class="page-btn">13</button>
    <button class="page-btn next-btn">›</button>
    <div class="page-jump">
      <span>前往</span>
      <input type="number" class="page-input" value="1" min="1" max="13" />
      <span>页</span>
      <button class="page-go-btn">确定</button>
    </div>
  </div>

</main>

<!-- ===== 商品详情弹窗 ===== -->
<div class="modal-overlay" id="modalOverlay">
  <div class="modal" id="productModal">
    <button class="modal-close" id="modalClose">✕</button>
    <div class="modal-body">
      <!-- 左侧图片区 -->
      <div class="modal-left">
        <div class="modal-main-img-wrap">
          <img src="" alt="" class="modal-main-img" id="modalMainImg" />
          <span class="modal-badge" id="modalBadge"></span>
        </div>
        <div class="modal-thumbs" id="modalThumbs">
          <!-- 缩略图 -->
        </div>
      </div>
      <!-- 右侧信息区 -->
      <div class="modal-right">
        <h2 class="modal-title" id="modalTitle"></h2>
        <p class="modal-desc" id="modalDesc"></p>
        <div class="modal-rating" id="modalRating"></div>
        <div class="modal-price-row">
          <span class="modal-price" id="modalPrice"></span>
          <span class="modal-old-price" id="modalOldPrice"></span>
          
        </div>

        

        <!-- 颜色选择 -->
        <div class="modal-option-section">
          <span class="option-label">颜色筛选</span>
          <div class="modal-colors" id="modalColors"></div>
        </div>

        <!-- 尺码选择 -->
        <div class="modal-option-section">
          <span class="option-label">尺寸筛选</span>
          <div class="modal-sizes" id="modalSizes"></div>
        </div>

        <!-- 服务信息 -->
        <div class="modal-service-info">
          <span class="service-item">🚚 极速发货</span>
          <span class="service-item">🔄 30天无忧退换</span>
          <span class="service-item">🔒 安全支付</span>
        </div>

        <!-- 客服社交按钮 -->
        <div class="modal-contact-btns">
          <a class="contact-btn telegram" href="https://t.me" target="_blank" rel="noopener noreferrer">
            <span class="contact-icon">✈</span>
            <span>Telegram support</span>
          </a>
          <!-- <a class="contact-btn facebook" href="https://facebook.com" target="_blank" rel="noopener noreferrer">
            <span class="contact-icon">f</span>
            <span>脸书客服</span>
          </a>
          <a class="contact-btn twitter" href="https://twitter.com" target="_blank" rel="noopener noreferrer">
            <span class="contact-icon">𝕏</span>
            <span>推特客服</span>
          </a>
          <a class="contact-btn ins" href="https://instagram.com" target="_blank" rel="noopener noreferrer">
            <span class="contact-icon">📷</span>
            <span>Ins客服</span>
          </a> -->
        </div>

      </div>
    </div>
  </div>
</div>

<script src="js/data.js"></script>
<script src="js/main.js"></script>
</body>
</html>
