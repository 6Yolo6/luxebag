<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LOUISVUITTON</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Noto+Sans+SC:wght@300;400;500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

<!-- ===== 顶部导航 ===== -->
<header class="navbar">
  <div class="nav-inner">
    <div class="nav-logo">
      <span class="logo-icon">👜</span>
      <span class="logo-text">LOUISVUITTON</span>
    </div>
    <nav class="nav-links">
      <a href="#" class="nav-link active" data-i18n="nav.home">홈</a>
      <!-- <a href="#" class="nav-link">全部商品</a>
      <a href="#" class="nav-link">新品上市</a>
      <a href="#" class="nav-link">限时折扣</a> -->
      <a href="https://t.me/Joy_kup" target="_blank" class="nav-link" data-i18n="nav.contact">문의하기</a>
    </nav>
    <div class="nav-right">
      <select id="languageSelect" class="language-select" aria-label="언어 선택">
        <option value="ko">한국어</option>
        <option value="en">English</option>
        <option value="zh">中文</option>
        <option value="de">Deutsch</option>
      </select>
      <button class="theme-toggle-btn" id="themeToggleBtn" data-i18n-title="nav.theme" title="테마 변경">🌙</button>
      <button class="hamburger-btn" id="hamburgerBtn" data-i18n-aria="nav.menu" aria-label="메뉴">
        <span></span><span></span><span></span>
      </button>
    </div>
  </div>
  <!-- 手机端抽屉菜单 -->
  <div class="mobile-menu" id="mobileMenu">
    <a href="#" class="mobile-nav-link" data-i18n="nav.home">🏠 홈</a>
    <!-- <a href="#" class="mobile-nav-link">🛍️ 전체 상품</a>
    <a href="#" class="mobile-nav-link">✨ 신상품</a>
    <a href="#" class="mobile-nav-link">🔥 한정 할인</a> -->
    <a href="https://t.me/Joy_kup" target="_blank" class="mobile-nav-link" data-i18n="nav.contact">💬 문의하기</a>
  </div>
</header>

<!-- ===== 主内容区 ===== -->
<main class="main-content">

  <!-- 页面标题 -->
  <div class="page-header">
    <h1 class="page-title" data-i18n="page.title">프리미엄 가방 전문관</h1>
    <p class="page-subtitle" data-i18n="page.subtitle">전 세계 고품질 패션 가방을 엄선하여 모든 스타일 요구를 만족시킵니다</p>
  </div>

  <!-- 分类标签 -->
  <div class="category-tabs">
    <button class="tab-btn active" data-cat="all" data-i18n="categories.all">전체</button>
    <button class="tab-btn" data-cat="hobo" data-i18n="categories.hobo">HOBO 핸드백</button>
    <button class="tab-btn" data-cat="shoulder" data-i18n="categories.shoulder">숄더백</button>
    <button class="tab-btn" data-cat="mini" data-i18n="categories.mini">미니백</button>
    <button class="tab-btn" data-cat="belt" data-i18n="categories.belt">벨트백</button>
    <button class="tab-btn" data-cat="crossbody" data-i18n="categories.crossbody">크로스바디</button>
    <button class="tab-btn" data-cat="tote" data-i18n="categories.tote">토트백</button>
    <button class="tab-btn" data-cat="bucket" data-i18n="categories.bucket">버킷백</button>
    <button class="tab-btn" data-cat="date" data-i18n="categories.date">데이트백</button>
  </div>

  <!-- 筛选栏 -->
  <div class="filter-bar">
    <div class="filter-left">
      <div class="filter-group">
        <label data-i18n="filter.priceLabel">가격대</label>
        <select class="filter-select">
          <option value="" data-i18n="filter.allPrices">全部价格</option>
          <option value="0-500">$0 - $500</option>
          <option value="500-1000">$500 - $1000</option>
          <option value="1000-2000">$1000 - $2000</option>
          <option value="2000+">$2000以上</option>
        </select>
      </div>
    </div>
    <div class="filter-right">
      <span class="sort-label" data-i18n="sort.label">排序</span>
      <button class="sort-btn active" data-sort="manual" data-i18n="sort.manual">기본</button>
      <button class="sort-btn" data-sort="price-asc" data-i18n="sort.priceAsc">가격 낮은 순</button>
      <button class="sort-btn" data-sort="price-desc" data-i18n="sort.priceDesc">가격 높은 순</button>
      <button class="sort-btn" data-sort="new" data-i18n="sort.new">최신</button>
      <div class="view-toggle">
        <button class="view-btn active" id="gridViewBtn" data-i18n-title="view.gridTitle" title="그리드 보기">⊞</button>
        <button class="view-btn" id="listViewBtn" data-i18n-title="view.listTitle" title="리스트 보기">☰</button>
      </div>
    </div>
  </div>

  <!-- 商品网格 -->
  <div class="product-grid" id="productGrid">
    <!-- JS 动态渲染 -->
  </div>

  <!-- 加载指示器 -->
  <div class="loading-indicator" id="loadingIndicator" style="display: none;">
    <div class="spinner"></div>
    <p data-i18n="loading">로딩 중...</p>
  </div>

</main>

<!-- ===== 右侧固定客服按钮 ===== -->
<a class="fixed-contact-btn" href="https://t.me/Joy_kup" target="_blank" rel="noopener noreferrer">
  <svg class="contact-icon" viewBox="0 0 24 24" width="24" height="24" fill="currentColor">
    <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm4.64 6.8c-.15 1.58-.8 5.42-1.13 7.19-.14.75-.42 1-.68 1.03-.58.05-1.02-.38-1.58-.75-.88-.58-1.38-.94-2.23-1.5-.99-.65-.35-1.01.22-1.59.15-.15 2.71-2.48 2.76-2.69.006-.03.01-.14-.07-.2-.08-.06-.19-.04-.27-.02-.12.02-1.96 1.25-5.54 3.67-.52.36-1.02.53-1.49.52-.49-.01-1.42-.27-2.12-.49-.86-.27-1.54-.42-1.48-.88.03-.24.35-.49 1.12-.75 4.35-1.89 7.24-3.14 8.66-3.72 3.71-1.53 4.48-1.8 4.981-1.8.11 0 .36.025.52.15.13.11.16.26.18.41-.01.13.007.29 0 .45z"/>
  </svg>
  <!-- <span>Telegram support</span> -->
</a>

<!-- ===== 商品详情弹窗 ===== -->
<div class="modal-overlay" id="modalOverlay">
  <div class="modal" id="productModal">
    <button class="modal-close" id="modalClose">✕</button>
    <div class="modal-body">
      <!-- 左侧图片区 -->
      <div class="modal-left">
        <div class="modal-main-img-wrap">
          <img src="" alt="" class="modal-main-img" id="modalMainImg" />
        </div>
        <div class="modal-thumbs" id="modalThumbs">
          <!-- 缩略图 -->
        </div>
      </div>
      <!-- 右侧信息区 -->
      <div class="modal-right">
        <h2 class="modal-title" id="modalTitle"></h2>
        <p class="modal-desc" id="modalDesc"></p>
        <div class="modal-rating" id="modalRating"></div>
        <div class="modal-price-row">
          <span class="modal-price" id="modalPrice"></span>
          <span class="modal-old-price" id="modalOldPrice"></span>
          
        </div>

        

        <!-- 颜色选择 -->
        <div class="modal-option-section" style="display: none;">
          <span class="option-label">颜色筛选</span>
          <div class="modal-colors" id="modalColors"></div>
        </div>

        <!-- 服务信息 -->
        <div class="modal-service-info">
          <span class="service-item" data-i18n="modal.service1">🚚 极速发货</span>
          <span class="service-item" data-i18n="modal.service2">🔄 30天无忧退换</span>
          <span class="service-item" data-i18n="modal.service3">🔒 安全支付</span>
        </div>

        <!-- 客服社交按钮 -->
        <div class="modal-contact-btns">
          <a class="contact-btn telegram" href="https://t.me" target="_blank" rel="noopener noreferrer">
            <svg class="contact-icon" viewBox="0 0 24 24" width="20" height="20" fill="currentColor">
              <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm4.64 6.8c-.15 1.58-.8 5.42-1.13 7.19-.14.75-.42 1-.68 1.03-.58.05-1.02-.38-1.58-.75-.88-.58-1.38-.94-2.23-1.5-.99-.65-.35-1.01.22-1.59.15-.15 2.71-2.48 2.76-2.69.006-.03.01-.14-.07-.2-.08-.06-.19-.04-.27-.02-.12.02-1.96 1.25-5.54 3.67-.52.36-1.02.53-1.49.52-.49-.01-1.42-.27-2.12-.49-.86-.27-1.54-.42-1.48-.88.03-.24.35-.49 1.12-.75 4.35-1.89 7.24-3.14 8.66-3.72 3.71-1.53 4.48-1.8 4.981-1.8.11 0 .36.025.52.15.13.11.16.26.18.41-.01.13.007.29 0 .45z"/>
            </svg>
            <span data-i18n="modal.telegram">Telegram 지원</span>
          </a>
        </div>

      </div>
    </div>
  </div>
</div>

<script src="js/data.js"></script>
<script src="js/main.js"></script>
</body>
</html>
